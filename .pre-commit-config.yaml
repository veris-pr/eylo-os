minimum_pre_commit_version: "4.5.1"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: no-hosted-automation
        name: Hosted automation remains absent
        entry: >-
          python3 -c 'from pathlib import Path;
          assert not any(path.is_file() for path in
          Path(".github/workflows").rglob("*")),
          "Hosted automation must remain absent."'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: python-lint-changed
        name: Python lint (changed files)
        # Add lint policy in server/pyproject.toml only after its full baseline passes.
        entry: >-
          server/.venv/bin/ruff check
          --config server/pyproject.toml
          --force-exclude
          --extend-ignore F401,F403,F811,E712
        language: system
        files: ^(server/eylo/|server/scripts/|cli/)
        types: [python]
        stages: [pre-commit, pre-push]

      - id: python-typed-repository-contracts
        name: Python shared repository and schema conversion types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
          eylo/common/repositories.py
          eylo/common/services.py'
        language: system
        files: ^server/(pyproject\.toml|eylo/common/(models|schemas|repositories|services)\.py)
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-typed-bootstrap-contracts
        name: Python deployment config and shared declaration contracts
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
          eylo/app.py eylo/common/config/
          eylo/common/schemas.py eylo/common/utils/cache.py
          eylo/common/contracts/tool_metadata.py
          eylo/modules/tools/services/tool_register.py
          eylo/modules/tools/schemas/claude.py
          eylo/pipelines/system_tools/spawn_task_fnf.py
          eylo/modules/provider_configs/exception_handlers.py'
        language: system
        files: ^server/(pyproject\.toml|eylo/(app\.py|common/(config/|schemas\.py|utils/cache\.py|contracts/tool_metadata\.py)|modules/(provider_configs/exception_handlers\.py|tools/(services/tool_register\.py|schemas/claude\.py))|pipelines/system_tools/spawn_task_fnf\.py))
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-typed-analytics-contracts
        name: Python analytics query and public response types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
