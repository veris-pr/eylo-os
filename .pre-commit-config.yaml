minimum_pre_commit_version: "4.5.1"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: no-hosted-automation
        name: Hosted automation remains absent
        entry: >-
          python3 -c 'from pathlib import Path;
          assert not any(path.is_file() for path in
          Path(".github/workflows").rglob("*")),
          "Hosted automation must remain absent."'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: python-lint-changed
        name: Python lint (changed files)
        # Add lint policy in server/pyproject.toml only after its full baseline passes.
        entry: >-
          server/.venv/bin/ruff check
          --config server/pyproject.toml
          --force-exclude
          --extend-ignore F401,F403,F811,E712
        language: system
        files: ^(server/eylo/|server/scripts/|cli/)
        types: [python]
        stages: [pre-commit, pre-push]

      - id: python-typed-repository-contracts
        name: Python shared repository and schema conversion types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
          eylo/common/repositories.py
          eylo/common/services.py'
        language: system
        files: ^server/(pyproject\.toml|eylo/common/(models|schemas|repositories|services)\.py)
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-typed-provider-config-contracts
        name: Python provider-config persistence, encryption and resolution types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
          eylo/modules/provider_configs/
          eylo/pipelines/external_connections/credentials.py'
        language: system
        files: ^server/(pyproject\.toml|eylo/(common/contracts/provider_config\.py|modules/provider_configs/|pipelines/external_connections/credentials\.py))
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-typed-agent-publication-contracts
        name: Python Agent definitions, swarms and explicit binding types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
          eylo/modules/agents/
          eylo/pipelines/agents/resolver.py
          eylo/pipelines/agents/swarm.py
          eylo/pipelines/parallel_agents/swarm_agent_worker.py'
        language: system
        files: ^server/(pyproject\.toml|eylo/(common/(schemas\.py|repositories\.py|services\.py|revisions\.py|contracts/provider_config\.py)|pipelines/(agents/|parallel_agents/swarm_agent_worker\.py)|modules/(agents/|tools/|templates/|voice/|voice_configs/|provider_configs/|llm_configs/|email_configs/|webrtc_configs/|embedding_configs/|reranking_configs/|memory_configs/)))
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: python-typed-embedding-contracts
        name: Python embedding adapter and runtime boundary types
        entry: >-
          bash -c 'cd server && .venv/bin/pyrefly check
