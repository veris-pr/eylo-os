minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
trustPolicyExclude:
  # Babel still requires this mature, signed semver 6 release.
  - semver@6.3.1

overrides:
  "nanoid@": 3.3.18

allowBuilds:
  esbuild: true
