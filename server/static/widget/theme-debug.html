<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Theme Test</title>
  </head>
  <body>
    <div id="app">
      <h1>Theme CSS Variables Test</h1>

      <div
        style="
          padding: 20px;
          margin: 20px;
          background: var(--chat-container-bg, red);
          border: 2px solid var(--chat-container-border, blue);
        "
      >
        <h2>Container (should have theme colors)</h2>
        <p style="color: var(--chat-ai-text, purple)">AI Text Color</p>
        <div
          style="
            background: var(--chat-header-bg, orange);
            color: var(--chat-header-text, pink);
            padding: 10px;
          "
        >
          Header Background
        </div>
      </div>

      <div
        class="chat-theme-dark"
        style="
          padding: 20px;
          margin: 20px;
          background: var(--chat-container-bg, red);
          border: 2px solid var(--chat-container-border, blue);
        "
      >
        <h2>Dark Theme (should have dark colors)</h2>
        <p style="color: var(--chat-ai-text, purple)">AI Text Color</p>
        <div
          style="
            background: var(--chat-header-bg, orange);
            color: var(--chat-header-text, pink);
            padding: 10px;
          "
        >
          Header Background
        </div>
      </div>
    </div>

    <link rel="stylesheet" href="/src/theme.css" />
  </body>
</html>
