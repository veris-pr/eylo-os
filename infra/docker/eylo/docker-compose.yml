name: eylo

x-eylo-environment: &eylo-environment
  ENV: local
  HOSTING_MODE: docker
  DB_USER: eylo
  DB_PASSWORD: eylo
  DB_HOST: postgres-17
  DB_PORT: "5432"
  DB_NAME: eylo
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-development-secret-change-me}
  AUTH_ALGORITHM: HS256
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REDIS_HOST: redis-7
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:8000/api}
  OAUTH_CALLBACK_URL: ${OAUTH_CALLBACK_URL:-http://localhost:8000/api/oauth/callback}
  FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5173}
  WIDGET_URL: ${WIDGET_URL:-http://127.0.0.1:5174}
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:5174","http://localhost:8000","http://127.0.0.1:5173","http://127.0.0.1:5174"]'
  REDIS_PASSWORD: ""

x-eylo-env-file: &eylo-env-file
  - path: ../../../server/eylo/common/config/.env.docker
    required: true

services:
  eylo-server:
    image: eylo-server:local
    build:
      context: ../../..
      dockerfile: infra/docker/eylo/Dockerfile
    environment: *eylo-environment
    env_file: *eylo-env-file
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        exec gunicorn --workers 2 --bind 0.0.0.0:8000
        --worker-class uvicorn.workers.UvicornWorker --timeout 120 main:app
    depends_on:
      postgres-17:
        condition: service_healthy
      redis-7:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    image: eylo-server:local
    environment: *eylo-environment
    env_file: *eylo-env-file
    command: python -m eylo.agent_run_worker
    healthcheck:
      disable: true
    depends_on:
      eylo-server:
        condition: service_healthy
      redis-7:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  postgres-17:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: eylo
      POSTGRES_USER: eylo
      POSTGRES_PASSWORD: eylo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eylo -d eylo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis-7:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
